name: 3DS Build

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build 3DS artifacts
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make -j"$(nproc)"

      - name: Upload 3DS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamu-3ds-${{ github.sha }}
          path: |
            streamu.3dsx
            streamu.cia
          if-no-files-found: error
